<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      font-family: -apple-system, Segoe UI, Roboto, sans-serif;
      width: 300px;
      padding: 12px;
      margin: 0;
    }
    h3 { margin: 0 0 8px; font-size: 14px; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      font-size: 13px;
      margin-bottom: 6px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    .row { display: flex; gap: 6px; }
    button {
      flex: 1;
      padding: 6px 8px;
      font-size: 13px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    #save { background: #2563eb; color: white; }
    #clear { background: #eee; }
    hr { margin: 12px 0; border: none; border-top: 1px solid #eee; }
    #list { max-height: 200px; overflow-y: auto; }
    .tab-item {
      padding: 6px 4px;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
    }
    .tab-item:hover { background: #f3f4f6; }
    .tag-badge {
      background: #2563eb;
      color: white;
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 11px;
      margin-right: 6px;
      white-space: nowrap;
    }
    .tab-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <h3>Tag this tab</h3>
  <input id="tagInput" placeholder="e.g. PYQ, Revision, Course..." />
  <div class="row">
    <button id="save">Save</button>
    <button id="clear">Clear</button>
  </div>
  <hr />
  <h3>Tagged tabs</h3>
  <div id="list"></div>
  <script src="popup.js"></script>
</body>
</html>
